<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0B0D10" />
    <!-- Apply the saved theme before first paint to avoid a flash. -->
    <script>
      (function () {
        var theme = "dark";
        try {
          var saved = localStorage.getItem("wt-theme");
          if (saved === "light" || saved === "dark") theme = saved;
        } catch (e) {}
        document.documentElement.setAttribute("data-theme", theme);
        if (theme === "light") {
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute("content", "#F6F5F1");
        }
      })();
    </script>
    <title>We Tech Hub — Tecnologia para negócios que já funcionam</title>
    <meta
      name="description"
      content="A We Tech identifica onde a tecnologia limita o crescimento do seu negócio e constrói a solução: automação, e-commerce, produtos digitais, modernização e IA aplicada."
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="We Tech Hub — Tecnologia para negócios que já funcionam" />
    <meta property="og:description" content="Identificamos onde a tecnologia limita o crescimento do seu negócio e construímos a solução." />
    <meta property="og:site_name" content="We Tech Hub" />

    <!-- Twitter -->
